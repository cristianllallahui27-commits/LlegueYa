8fafc" opacity="0.97"/><text x="1720" y="884" font-size="19" text-anchor="start">Lee/escribe / SQL*</text><rect x="2028" y="652" width="200.29999999999998" height="35" fill="#f8fafc" opacity="0.97"/><text x="2036" y="672" font-size="19" text-anchor="start">Enruta / HTTPS JSON</text><rect x="2040" y="864" width="190.6" height="35" fill="#f8fafc" opacity="0.97"/><text x="2048" y="884" font-size="19" text-anchor="start">Lee/escribe / SQL*</text><text x="65" y="1120" font-size="21" text-anchor="start">Cada API valida permisos y solo accede a su propia base. Sin tablas compartidas ni transacciones globales.</text><text x="40" y="1160" font-size="19" text-anchor="start">Rectángulo azul: contenedor de aplicación. Cilindro: contenedor de datos. Marco: límite del sistema. Flecha: solicitud o acceso.</text><text x="40" y="1185" font-size="19" text-anchor="start">(*) Tecnología candidata, pendiente del SDD. Siete bases lógicas no implican siete servidores físicos.</text></g></svg>