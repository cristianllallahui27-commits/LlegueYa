t-size="21" text-anchor="middle" font-weight="bold">GW · Entrada API</text><text x="1190.0" y="550.5" font-size="21" text-anchor="middle">[Contenedor: Nginx*]</text><text x="1190.0" y="577.5" font-size="21" text-anchor="middle">Enruta peticiones y limita tráfico</text><rect x="60" y="700" width="292" height="140" fill="#dbeafe" stroke="#21609c" stroke-width="2"/><text x="206.0" y="737.0" font-size="19" text-anchor="middle" font-weight="bold">I · Identidad y acceso</text><text x="206.0" y="762.0" font-size="19" text-anchor="middle">[Contenedor API]</text><text x="206.0" y="787.0" font-size="19" text-anchor="middle">Python/FastAPI*</text><text x="206.0" y="812.0" font-size="19" text-anchor="middle">Cuenta, perfil y permisos</text><rect x="388" y="700" width="292" height="140" fill="#dbeafe" stroke="#21609c" stroke-width="2"/><text x="534.0" y="739.0" font-size="17" text-anchor="middle" font-weight="bold">C · Catálogo y proveedores</text><text x="534.0" y="762.0" font-size="17" text-anchor="middle">[Contenedor API]</text><text x="534.0" y="785.0" font-size="17" text-anchor="middle">Python/FastAPI*</text><text x="534.0" y="808.0" font-size="17" text-anchor="middle">Lugares, ofertas y movilidad</text><rect x="716" y="700" width="292" height="140" fill="#dbeafe" stroke="#21609c" stroke-width="2"/><text x="862.0" y="738.0" font-size="18" text-anchor="middle" font-weight="bold">M · Comunidad y contenido</text><text x="862.0" y="762.0" font-size="18" text-anchor="middle">[Contenedor API]</text><text x="862.0" y="786.0" font-size="18" text-anchor="middle">Python/FastAPI*</text><text x="862.0" y="810.0" font-size="18" text-anchor="middle">Experiencias, likes e hilos</text><rect x="1044" y="700" width="292" height="140" fill="#dbeafe" stroke="#21609c" stroke-width="2"/><text x="1190.0" y="727.5" font-size="17" text-anchor="middle" font-weight="bold">E · Eventos y notificaciones</text><text x="1190.0" y="750.5" font-size="17" text-anchor="middle">[Contenedor API]</text><text x="1190.0" y="773.5" font-size="17" text-anchor="middle">Python/FastAPI*</text><text x="1190.0" y="796.5" font-size="17" text-anchor="middle">Calendario, propuestas y</text><text x="1190.0" y="819.5" font-size="17" text-anchor="middle">avisos</text><rect x="1372" y="700" width="292" height="140" fill="#dbeafe" stroke="#21609c" stroke-width="2"/><text x="1518.0" y="738.0" font-size="18" text-anchor="middle" font-weight="bold">P · Publicidad y planes</text><text x="1518.0" y="762.0" font-size="18" text-anchor="middle">[Contenedor API]</text><text x="1518.0" y="786.0" font-size="18" text-anchor="middle">Python/FastAPI*</text><text x="1518.0" y="810.0" font-size="18" text-anchor="middle">Gratuidad, pagos y campañas</text><rect x="1700" y="700" width="292" height="140" fill="#dbeafe" stroke="#21609c" stroke-width="2"/><text x="1846.0" y="727.5" font-size="17" text-anchor="middle" font-weight="bold">R · Recomendaciones y</text><text x="1846.0" y="750.5" font-size="17" text-anchor="middle">paquetes</text><text x="1846.0" y="773.5" font-size="17" text-anchor="middle">[Contenedor API]</text><text x="1846.0" y="796.5" font-size="17" text-anchor="middle">Python/FastAPI*</text><text x="1846.0" y="819.5" font-size="17" text-anchor="middle">Familia y presupuesto</text><rect x="2028" y="700" width="292" height="140" fill="#dbeafe" stroke="#21609c" stroke-width="2"/><text x="2174.0" y="735.0" font-size="21" text-anchor="middle" font-weight="bold">A · Asistente turístico</text><text x="2174.0" y="762.0" font-size="21" text-anchor="middle">[Contenedor API]</text><text x="2174.0" y="789.0" font-size="21" text-anchor="middle">Python/FastAPI*</text><text x="2174.0" y="816.0" font-size="21" text-anchor="middle">Conversación autorizada</text><path d="M70,958 C70,934 2310,934 2310,958 L2310,1092 C2310,1116 70,1116 70,1092 Z" fill="#fff2cc" stroke="#927400" stroke-width="2"/><path d="M70,958 C70,982 2310,982 2310,958" fill="none" stroke="#927400" stroke-width="2"/><text x="1190.0" y="1009.0" font-size="21" text-anchor="middle" font-weight="bold">DB · Supabase PostgreSQL</text><text x="1190.0" y="1036.0" font-size="21" text-anchor="middle">[Contenedor de datos gestionado]</text><text x="1190.0" y="1063.0" font-size="21" text-anchor="middle">identidad · catalogo · comunidad · eventos · publicidad · recomendaciones · asistente</text><text x="1190.0" y="1090.0" font-size="21" text-anchor="middle">Un esquema y rol técnico por servicio. Sin acceso a tablas de otros dominios.</text><rect x="1617" y="215" width="210.0" height="35" fill="#f8fafc" opacity="0.97"/><text x="1625" y="235" font-size="19" text-anchor="start">Usa interfaz / HTTPS</text><rect x="1617" y="425" width="287.59999999999997" height="60" fill="#f8fafc" opacity="0.97"/><text x="1625" y="445" font-size="19" text-anchor="start">Solicita operaciones / HTTPS</text><text x="1625" y="470" font-size="19" text-anchor="start">JSON</text><rect x="60" y="652" width="200.29999999999998" height="35" fill="#f8fafc" opacity="0.97"/><text x="68" y="672" font-size="19" text-anchor="start">Enruta / HTTPS JSON</text><rect x="72" y="864" width="151.79999999999998" height="35" fill="#f8fafc" opacity="0.97"/><text x="80" y="884" font-size="19" text-anchor="start">SQL: identidad</text><rect x="388" y="652" width="200.29999999999998" height="35" fill="#f8fafc" opacity="0.97"/><text x="396" y="672" font-size="19" text-anchor="start">Enruta / HTTPS JSON</text><rect x="400" y="864" width="142.1" height="35" fill="#f8fafc" opacity="0.97"/><text x="408" y="884" font-size="19" text-anchor="start">SQL: catalogo</text><rect x="716" y="652" width="200.29999999999998" height="35" fill="#f8fafc" opacity="0.97"/><text x="724" y="672" font-size="19" text-anchor="start">Enruta / HTTPS JSON</text><rect x="728" y="864" width="151.79999999999998" height="35" fill="#f8fafc" opacity="0.97"/><text x="736" y="884" font-size="19" text-anchor="start">SQL: comunidad</text><rect x="1044" y="652" width="200.29999999999998" height="35" fill="#f8fafc" opacity="0.97"/><text x="1052" y="672" font-size="19" text-anchor="start">Enruta / HTTPS JSON</text><rect x="1056" y="864" width="132.39999999999998" height="35" fill="#f8fafc" opacity="0.97"/><text x="1064" y="884" font-size="19" text-anchor="start">SQL: eventos</text><rect x="1372" y="652" width="200.29999999999998" height="35" fill="#f8fafc" opacity="0.97"/><text x="1380" y="672" font-size="19" text-anchor="start">Enruta / HTTPS JSON</text><rect x="1384" y="864" width="161.5" height="35" fill="#f8fafc" opacity="0.97"/><text x="1392" y="884" font-size="19" text-anchor="start">SQL: publicidad</text><rect x="1700" y="652" width="200.29999999999998" height="35" fill="#f8fafc" opacity="0.97"/><text x="1708" y="672" font-size="19" text-anchor="start">Enruta / HTTPS JSON</text><rect x="1712" y="864" width="210.0" height="35" fill="#f8fafc" opacity="0.97"/><text x="1720" y="884" font-size="19" text-anchor="start">SQL: recomendaciones</text><rect x="2028" y="652" width="200.29999999999998" height="35" fill="#f8fafc" opacity="0.97"/><text x="2036" y="672" font-size="19" text-anchor="start">Enruta / HTTPS JSON</text><rect x="2040" y="864" width="151.79999999999998" height="35" fill="#f8fafc" opacity="0.97"/><text x="2048" y="884" font-size="19" text-anchor="start">SQL: asistente</text><text x="65" y="1190" font-size="21" text-anchor="start">Cada servicio conserva transacciones y permisos exclusivos. Una base compartida también comparte capacidad y disponibilidad.</text><text x="40" y="1260" font-size="19" text-anchor="start">Azul: aplicación. Cilindro: un contenedor de datos con siete esquemas. Flecha: solicitud o acceso a datos.</text><text x="40" y="1285" font-size="19" text-anchor="start">(*) Propuestas técnicas del SDD. Supabase está elegido; no se muestran siete bases físicamente independientes.</text></g></svg>