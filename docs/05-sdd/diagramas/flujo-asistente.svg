<svg xmlns="http://www.w3.org/2000/svg" width="2290" height="1100" viewBox="0 0 2290 1100" role="img" aria-label="Asistente turístico · control del contexto y Gemini"><defs><marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1,1 L11,6 L1,11 Z" fill="#42566c"/></marker><marker id="realize" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M1,1 L13,7 L1,13 Z" fill="white" stroke="#42566c" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#f8fafc"/><g font-family="Arial, sans-serif" fill="#17243a"><text x="40" y="48" font-size="32" text-anchor="start" font-weight="bold">Asistente turístico · control del contexto y Gemini</text><text x="40" y="88" font-size="21" text-anchor="start">El cálculo y la autorización pertenecen a LlegueYa; Gemini redacta con información filtrada.</text><path d="M700,330.0 L780,330.0" fill="none" stroke="#42566c" stroke-width="2" marker-end="url(#arrow)"/><path d="M1430,330.0 L1510,330.0" fill="none" stroke="#42566c" stroke-width="2" marker-end="url(#arrow)"/><path d="M1835.0,410 L1835.0,740" fill="none" stroke="#42566c" stroke-width="2" marker-end="url(#arrow)"/><path d="M1510,820.0 L1430,820.0" fill="none" stroke="#42566c" stroke-width="2" marker-end="url(#arrow)"/><path d="M780,820.0 L700,820.0" fill="none" stroke="#42566c" stroke-width="2" marker-end="url(#arrow)"/><rect x="50" y="250" width="650" height="160" fill="#e3f3e7" stroke="#257148" stroke-width="2"/><text x="375.0" y="322.0" font-size="21" text-anchor="middle" font-weight="bold">Consulta del turista</text><text x="375.0" y="349.0" font-size="21" text-anchor="middle">Destino, grupo, fechas y presupuesto</text><rect x="780" y="250" width="650" height="160" fill="#e3f3e7" stroke="#257148" stroke-width="2"/><text x="1105.0" y="322.0" font-size="21" text-anchor="middle" font-weight="bold">Validar sesión y acceso</text><text x="1105.0" y="349.0" font-size="21" text-anchor="middle">Separar público y detalle</text><rect x="1510" y="250" width="650" height="160" fill="#e3f3e7" stroke="#257148" stroke-width="2"/><text x="1835.0" y="308.5" font-size="21" text-anchor="middle" font-weight="bold">Recuperar y calcular</text><text x="1835.0" y="335.5" font-size="21" text-anchor="middle">C/E/R: ofertas y presupuesto</text><text x="1835.0" y="362.5" font-size="21" text-anchor="middle">P: patrocinio elegible</text><rect x="1510" y="740" width="650" height="160" fill="#e3f3e7" stroke="#257148" stroke-width="2"/><text x="1835.0" y="798.5" font-size="21" text-anchor="middle" font-weight="bold">Gemini en servidor</text><text x="1835.0" y="825.5" font-size="21" text-anchor="middle">Solo contexto autorizado</text><text x="1835.0" y="852.5" font-size="21" text-anchor="middle">Fuentes y cifras disponibles</text><rect x="780" y="740" width="650" height="160" fill="#e3f3e7" stroke="#257148" stroke-width="2"/><text x="1105.0" y="798.5" font-size="21" text-anchor="middle" font-weight="bold">Validar respuesta</text><text x="1105.0" y="825.5" font-size="21" text-anchor="middle">Ids, precios, patrocinio</text><text x="1105.0" y="852.5" font-size="21" text-anchor="middle">Descartar salida inventada</text><rect x="50" y="740" width="650" height="160" fill="#e3f3e7" stroke="#257148" stroke-width="2"/><text x="375.0" y="798.5" font-size="21" text-anchor="middle" font-weight="bold">Mostrar orientación</text><text x="375.0" y="825.5" font-size="21" text-anchor="middle">Fuentes y alternativas orgánicas</text><text x="375.0" y="852.5" font-size="21" text-anchor="middle">Guardar solo con cuenta</text><rect x="702" y="195" width="103.3" height="35" fill="#f8fafc" opacity="0.97"/><text x="710" y="215" font-size="19" text-anchor="start">Solicitud</text><rect x="1382" y="195" width="210.0" height="35" fill="#f8fafc" opacity="0.97"/><text x="1390" y="215" font-size="19" text-anchor="start">Permisos y criterios</text><rect x="1612" y="540" width="161.5" height="35" fill="#f8fafc" opacity="0.97"/><text x="1620" y="560" font-size="19" text-anchor="start">Contexto mínimo</text><rect x="1382" y="645" width="229.39999999999998" height="35" fill="#f8fafc" opacity="0.97"/><text x="1390" y="665" font-size="19" text-anchor="start">Respuesta estructurada</text><rect x="702" y="645" width="132.39999999999998" height="35" fill="#f8fafc" opacity="0.97"/><text x="710" y="665" font-size="19" text-anchor="start">Texto seguro</text><text x="40" y="1030" font-size="19" text-anchor="start">Caja: responsabilidad del flujo. Flecha: paso y datos permitidos.</text><text x="40" y="1055" font-size="19" text-anchor="start">Ninguna clave o expediente se envía al navegador o al contexto del modelo. Sin sesión se limita el detalle.</text></g></svg>