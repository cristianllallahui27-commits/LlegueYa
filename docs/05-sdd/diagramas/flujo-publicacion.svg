<svg xmlns="http://www.w3.org/2000/svg" width="1910" height="1030" viewBox="0 0 1910 1030" role="img" aria-label="Publicación y moderación · estados"><defs><marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1,1 L11,6 L1,11 Z" fill="#42566c"/></marker><marker id="realize" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M1,1 L13,7 L1,13 Z" fill="white" stroke="#42566c" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#f8fafc"/><g font-family="Arial, sans-serif" fill="#17243a"><text x="40" y="48" font-size="32" text-anchor="start" font-weight="bold">Publicación y moderación · estados</text><text x="40" y="88" font-size="21" text-anchor="start">Modelo de comportamiento. No representa servicios desplegables ni un nivel C4.</text><path d="M530,315.0 L680,315.0" fill="none" stroke="#42566c" stroke-width="2" marker-end="url(#arrow)"/><path d="M1160,315.0 L1310,315.0" fill="none" stroke="#42566c" stroke-width="2" marker-end="url(#arrow)"/><path d="M920.0,380 L920.0,660" fill="none" stroke="#42566c" stroke-width="2" marker-end="url(#arrow)"/><path d="M1550.0,380 L1550.0,660" fill="none" stroke="#42566c" stroke-width="2" marker-end="url(#arrow)"/><path d="M680,725.0 L290,725 L290.0,380" fill="none" stroke="#42566c" stroke-width="2" marker-end="url(#arrow)"/><path d="M1550.0,250 L1550,170 L920,170 L920.0,250" fill="none" stroke="#42566c" stroke-width="2" marker-end="url(#arrow)"/><rect x="50" y="250" width="480" height="130" fill="#e3f3e7" stroke="#257148" stroke-width="2"/><text x="290.0" y="307.0" font-size="21" text-anchor="middle" font-weight="bold">Borrador</text><text x="290.0" y="334.0" font-size="21" text-anchor="middle">Autor prepara texto y fotos</text><rect x="680" y="250" width="480" height="130" fill="#e3f3e7" stroke="#257148" stroke-width="2"/><text x="920.0" y="307.0" font-size="21" text-anchor="middle" font-weight="bold">En revisión</text><text x="920.0" y="334.0" font-size="21" text-anchor="middle">Administración revisa versión</text><rect x="1310" y="250" width="480" height="130" fill="#e3f3e7" stroke="#257148" stroke-width="2"/><text x="1550.0" y="307.0" font-size="21" text-anchor="middle" font-weight="bold">Publicado</text><text x="1550.0" y="334.0" font-size="21" text-anchor="middle">Visible según política</text><rect x="680" y="660" width="480" height="130" fill="#e3f3e7" stroke="#257148" stroke-width="2"/><text x="920.0" y="717.0" font-size="21" text-anchor="middle" font-weight="bold">Rechazado</text><text x="920.0" y="744.0" font-size="21" text-anchor="middle">Motivo para corregir</text><rect x="1310" y="660" width="480" height="130" fill="#e3f3e7" stroke="#257148" stroke-width="2"/><text x="1550.0" y="717.0" font-size="21" text-anchor="middle" font-weight="bold">Retirado</text><text x="1550.0" y="744.0" font-size="21" text-anchor="middle">Sin nuevas lecturas/interacciones</text><rect x="542" y="190" width="151.79999999999998" height="35" fill="#f8fafc" opacity="0.97"/><text x="550" y="210" font-size="19" text-anchor="start">Enviar versión</text><rect x="1172" y="190" width="287.59999999999997" height="35" fill="#f8fafc" opacity="0.97"/><text x="1180" y="210" font-size="19" text-anchor="start">Aprobar y preparar derivados</text><rect x="732" y="510" width="200.29999999999998" height="35" fill="#f8fafc" opacity="0.97"/><text x="740" y="530" font-size="19" text-anchor="start">Rechazar con motivo</text><rect x="1352" y="510" width="307.0" height="35" fill="#f8fafc" opacity="0.97"/><text x="1360" y="530" font-size="19" text-anchor="start">Retirar por autor o moderación</text><rect x="62" y="600" width="93.6" height="35" fill="#f8fafc" opacity="0.97"/><text x="70" y="620" font-size="19" text-anchor="start">Corregir</text><rect x="802" y="170" width="277.9" height="35" fill="#f8fafc" opacity="0.97"/><text x="810" y="190" font-size="19" text-anchor="start">Editar contenido sustancial</text><text x="40" y="960" font-size="19" text-anchor="start">Caja: estado de publicación. Flecha: transición autorizada y auditada.</text><text x="40" y="985" font-size="19" text-anchor="start">La aprobación exige archivos validados y derivados preparados. Editar vuelve a revisión.</text></g></svg>