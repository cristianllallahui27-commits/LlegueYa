ont-size="20" text-anchor="middle">id, objetivo_tipo/id</text><text x="960.0" y="296" font-size="20" text-anchor="middle">padre_id, raiz_id, autor_id</text><text x="960.0" y="322" font-size="20" text-anchor="middle">texto, estado</text><line x1="720" x2="1200" y1="246" y2="246" stroke="#257148"/><rect x="1370" y="200" width="480" height="175" fill="#e3f3e7" stroke="#257148" stroke-width="2"/><text x="1610.0" y="230" font-size="21" text-anchor="middle" font-weight="bold">like</text><text x="1610.0" y="270" font-size="20" text-anchor="middle">usuario_id remoto</text><text x="1610.0" y="296" font-size="20" text-anchor="middle">objetivo_tipo/id</text><text x="1610.0" y="322" font-size="20" text-anchor="middle">UNIQUE usuario + tipo + id</text><line x1="1370" x2="1850" y1="246" y2="246" stroke="#257148"/><rect x="60" y="690" width="480" height="175" fill="#e3f3e7" stroke="#257148" stroke-width="2"/><text x="300.0" y="720" font-size="21" text-anchor="middle" font-weight="bold">coleccion</text><text x="300.0" y="760" font-size="20" text-anchor="middle">id, propietario_id remoto</text><text x="300.0" y="786" font-size="20" text-anchor="middle">nombre, descripción</text><line x1="60" x2="540" y1="736" y2="736" stroke="#257148"/><rect x="720" y="690" width="480" height="175" fill="#e3f3e7" stroke="#257148" stroke-width="2"/><text x="960.0" y="720" font-size="21" text-anchor="middle" font-weight="bold">elemento_coleccion</text><text x="960.0" y="760" font-size="20" text-anchor="middle">coleccion_id FK</text><text x="960.0" y="786" font-size="20" text-anchor="middle">objetivo_tipo/id remoto</text><text x="960.0" y="812" font-size="20" text-anchor="middle">UNIQUE colección + tipo + id</text><line x1="720" x2="1200" y1="736" y2="736" stroke="#257148"/><rect x="1370" y="690" width="480" height="175" fill="#e3f3e7" stroke="#257148" stroke-width="2"/><text x="1610.0" y="720" font-size="21" text-anchor="middle" font-weight="bold">objeto</text><text x="1610.0" y="760" font-size="20" t