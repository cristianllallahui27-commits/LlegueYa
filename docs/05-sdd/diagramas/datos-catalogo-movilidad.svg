ke-width="2"/><text x="945.0" y="230" font-size="21" text-anchor="middle" font-weight="bold">oferta</text><text x="945.0" y="270" font-size="20" text-anchor="middle">id, negocio_id FK</text><text x="945.0" y="296" font-size="20" text-anchor="middle">precio, moneda, unidad, vigencia</text><line x1="700" x2="1190" y1="246" y2="246" stroke="#257148"/><rect x="1370" y="200" width="490" height="170" fill="#e3f3e7" stroke="#257148" stroke-width="2"/><text x="1615.0" y="230" font-size="21" text-anchor="middle" font-weight="bold">tramo_movilidad</text><text x="1615.0" y="270" font-size="20" text-anchor="middle">id, oferta_id FK, origen_id FK</text><text x="1615.0" y="296" font-size="20" text-anchor="middle">destino y horario informado</text><line x1="1370" x2="1860" y1="246" y2="246" stroke="#257148"/><rect x="1370" y="650" width="490" height="170" fill="#e3f3e7" stroke="#257148" stroke-width="2"/><text x="1615.0" y="680" font-size="21" text-anchor="middle" font-weight="bold">punto_movilidad</text><text x="1615.0" y="720" font-size="20" text-anchor="middle">id, destino_id FK</text><text x="1615.0" y="746" font-size="20" text-anchor="middle">terminal / punto de embarque</text><text x="1615.0" y="772" font-size="20" text-anchor="middle">dirección, lat/lon, fuente, estado</text><line x1="1370" x2="1860" y1="696" y2="696" stroke="#257148"/><rect x="700" y="650" width="490" height="170" fill="#e3f3e7" stroke="#257148" stroke-width="2"/><text x="945.0" y="680" font-size="21" text-anchor="middle" font-weight="bold">lugar</text><text x="945.0" y="720" font-size="20" text-anchor="middle">id, destino_id FK</text><text x="945.0" y="746" font-size="20" text-anchor="middle">tipo, lat/lon, estado</text><text x="945.0" y="772" font-size="20" text-anchor="middle">condiciones y revisión</text><line x1="700" x2="1190" y1="696" y2="696" stroke="#257148"/><rect x="70" y="650" width="490" height="170" fill="#e3f3e7" stroke="#257148" stroke-width="2"/><text x="315.0" y="680" font-size="21" text-anchor="middle" font-weight="bold">evidencia</text><text x="315.0" y="720" font-size="20" text-anchor="middle">id, negocio_id FK, objeto_id</text><text x="315.0" y="746" font-size="20" text-anchor="middle">estado y motivo de revisión</text><text x="315.0" y="772" font-size="20" text-anchor="middle">binario privado en Storage</text><line x1="70" x2="560" y1="696" y2="696" stroke="#257148"/><rect x="568.65" y="238.0" width="122.69999999999999" height="35" fill="#f8fafc" opacity="0.97"/><text x="576.65" y="258.0" font-size="19" text-anchor="start">1:N ofertas</text><rect x="1202" y="235" width="113.0" height="35" fill="#f8fafc" opacity="0.97"/><text x="1210" y="255" font-size="19" text-anchor="start">1:N tramos</text><rect x="1462" y="510" width="132.39999999999998" height="35" fill="#f8fafc" opacity="0.97"/><text x="1470" y="530" font-size="19" text-anchor="start">1:N · origen</text><rect x="112" y="500" width="248.79999999999998" height="35" fill="#f8fafc" opacity="0.97"/><text x="120" y="520" font-size="19" text-anchor="start">1:N · presenta evidencia</text><rect x="932" y="490" width="229.39999999999998" height="35" fill="#f8fafc" opacity="0.97"/><text x="940" y="510" font-size="19" text-anchor="start">0:N · destino revisado</text><text x="40" y="990" font-size="19" text-anchor="start">Cajas: tablas lógicas de catalogo. Etiqueta 1:N: cardinalidad local. UUID remoto: referencia validada por API.</text><text x="40" y="1015" font-size="19" text-anchor="start">El terminal no garantiza asientos ni verificación del operador. No se almacenan posiciones del turista.</text></g></svg>