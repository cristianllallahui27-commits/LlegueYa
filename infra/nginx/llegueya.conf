# nginx como puerta de entrada (API gateway + servidor estático).
# Cloudflare se coloca delante como DNS/CDN (ver docs/06-desarrollo/DESPLIEGUE-DNS-CDN.md).
upstream gateway   { server gateway:8000; keepalive 16; }
upstream catalogo  { server catalogo:8000; keepalive 32; }   # Docker reparte entre réplicas
upstream comunidad { server comunidad:8000; keepalive 16; }

# Caché de respuestas públicas del catálogo en el propio nginx (además del CDN).
proxy_cache_path /var/cache/nginx/catalogo levels=1:2 keys_zone=catalogo:10m max_size=100m inactive=10m use_temp_path=off;
limit_req_zone $binary_remote_addr zone=escritura:10m rate=10r/s;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 6m;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  add_header X-Content-Type-Options nosniff always;

  # Recursos estáticos versionables: caché larga en navegador y CDN.
  location ~* ^/(vendor|fuentes|img)/ { expires 30d; add_header Cache-Control "public, max-age=2592000, immutable"; }
  location ~* \.(css|js)$ { expires 1h; add_header Cache-Control "public, max-age=3600"; }
  location = /logo.png { expires 30d; }
  location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }

  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  location /api/v1/catalogo/ {
    proxy_pass http://catalogo;
    proxy_cache catalogo;
    proxy_cache_methods GET HEAD;
    proxy_cache_valid 200 60s;
    proxy_cache_use_stale error timeout updating;
    proxy_cache_bypass $cookie_ly_session;   # fichas con sesión nunca salen de caché compartida
    proxy_no_cache $cookie_ly_session;
    add_header X-Cache $upstream_cache_status always;
  }
  location /api/v1/comunidad/ { limit_req zone=escritura burst=20 nodelay; proxy_pass http://comunidad; }
  location /api/ { limit_req zone=escritura burst=30 nodelay; proxy_pass http://gateway; }
}
