<svg xmlns="http://www.w3.org/2000/svg" width="1910" height="1100" viewBox="0 0 1910 1100" role="img" aria-label="LlegueYa · Clean Architecture dentro de cada servicio"><defs><marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1,1 L11,6 L1,11 Z" fill="#42566c"/></marker><marker id="realize" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M1,1 L13,7 L1,13 Z" fill="white" stroke="#42566c" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#f8fafc"/><g font-family="Arial, sans-serif" fill="#17243a"><text x="40" y="48" font-size="32" text-anchor="start" font-weight="bold">LlegueYa · Clean Architecture dentro de cada servicio</text><text x="40" y="88" font-size="21" text-anchor="start">Estilo global: distribuido orientado a servicios. Esta vista muestra dependencias internas de código, no un nivel C4.</text><rect x="30" y="140" width="1540" height="790" fill="white" stroke="#61758a" stroke-width="2" stroke-dasharray="10 6"/><text x="48" y="170" font-size="23" text-anchor="start" font-weight="bold">Ejemplo: interior del servicio P · Publicidad y planes</text><path d="M440,330.0 L600,340.0" fill="none" stroke="#42566c" stroke-width="2" marker-end="url(#arrow)"/><path d="M1020,340.0 L1160,340.0" fill="none" stroke="#42566c" stroke-width="2" marker-end="url(#arrow)"/><path d="M810.0,650 L810.0,430" fill="none" stroke="#42566c" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#realize)"/><path d="M1020,740.0 L1620,750.0" fill="none" stroke="#42566c" stroke-width="2" marker-end="url(#arrow)"/><rect x="70" y="250" width="370" height="160" fill="#e3f3e7" stroke="#257148" stroke-width="2"/><text x="255.0" y="295.0" font-size="21" text-anchor="middle" font-weight="bold">Presentación</text><text x="255.0" y="322.0" font-size="21" text-anchor="middle">Controladores REST</text><text x="255.0" y="349.0" font-size="21" text-anchor="middle">Reciben solicitudes y validan</text><text x="255.0" y="376.0" font-size="21" text-anchor="middle">acceso</text><rect x="600" y="250" width="420" height="180" fill="#e9e2f5" stroke="#7954a1" stroke-width="2"/><text x="810.0" y="280" font-size="21" text-anchor="middle" font-weight="bold">Aplicación</text><text x="810.0" y="320" font-size="20" text-anchor="middle">Casos de uso y puertos</text><text x="810.0" y="346" font-size="20" text-anchor="middle">Gestión comercial /</text><text x="810.0" y="372" font-size="20" text-anchor="middle">SeleccionarAnuncios</text><text x="810.0" y="398" font-size="20" text-anchor="middle">Repositorio / ConsultaElegibilidad</text><line x1="600" x2="1020" y1="296" y2="296" stroke="#7954a1"/><rect x="1160" y="250" width="370" height="180" fill="#e3f3e7" stroke="#257148" stroke-width="2"/><text x="1345.0" y="280" font-size="21" text-anchor="middle" font-weight="bold">Dominio</text><text x="1345.0" y="320" font-size="20" text-anchor="middle">Entidades y reglas</text><text x="1345.0" y="346" font-size="20" text-anchor="middle">Campaña, beneficio, plan</text><text x="1345.0" y="372" font-size="20" text-anchor="middle">Compatibilidad y vigencia</text><line x1="1160" x2="1530" y1="296" y2="296" stroke="#257148"/><rect x="600" y="650" width="420" height="180" fill="#e3f3e7" stroke="#257148" stroke-width="2"/><text x="810.0" y="705.0" font-size="21" text-anchor="middle" font-weight="bold">Infraestructura</text><text x="810.0" y="732.0" font-size="21" text-anchor="middle">Implementaciones de puertos</text><text x="810.0" y="759.0" font-size="21" text-anchor="middle">Repositorio SQL y clientes HTTP</text><text x="810.0" y="786.0" font-size="21" text-anchor="middle">Mensajería y objetos</text><path d="M1620,688 C1620,664 1880,664 1880,688 L1880,812 C1880,836 1620,836 1620,812 Z" fill="#fff2cc" stroke="#927400" stroke-width="2"/><path d="M1620,688 C1620,712 1880,712 1880,688" fill="none" stroke="#927400" stroke-width="2"/><text x="1750.0" y="726.5" font-size="17" text-anchor="middle" font-weight="bold">DP · Base propia del</text><text x="1750.0" y="749.5" font-size="17" text-anchor="middle">servicio</text><text x="1750.0" y="772.5" font-size="17" text-anchor="middle">[Contenedor de datos]</text><text x="1750.0" y="795.5" font-size="17" text-anchor="middle">Fuera del proceso, dentro</text><text x="1750.0" y="818.5" font-size="17" text-anchor="middle">de LlegueYa</text><rect x="442" y="200" width="200.29999999999998" height="35" fill="#f8fafc" opacity="0.97"/><text x="450" y="220" font-size="19" text-anchor="start">Invoca casos de uso</text><rect x="1027" y="200" width="229.39999999999998" height="35" fill="#f8fafc" opacity="0.97"/><text x="1035" y="220" font-size="19" text-anchor="start">Usa entidades y reglas</text><rect x="682" y="530" width="190.6" height="35" fill="#f8fafc" opacity="0.97"/><text x="690" y="550" font-size="19" text-anchor="start">Implementa puertos</text><rect x="1112" y="700" width="239.1" height="35" fill="#f8fafc" opacity="0.97"/><text x="1120" y="720" font-size="19" text-anchor="start">Acceso SQL en ejecución</text><text x="50" y="980" font-size="21" text-anchor="start">Clean Architecture puede usarse en sistemas distribuidos o monolíticos. LlegueYa define siete servicios independientes.</text><text x="50" y="1007" font-size="21" text-anchor="start">Las pantallas pertenecen a WEB. Cada API tiene sus controladores y valida permisos. El dominio no conoce proveedores técnicos.</text><text x="40" y="1030" font-size="19" text-anchor="start">Continua: dependencia de código hacia el interior. Discontinua y triángulo: implementación de puertos interiores.</text><text x="40" y="1055" font-size="19" text-anchor="start">La interacción de infraestructura con recursos se indica aparte. No hay dependencia del Dominio hacia SQL, HTTP o frameworks.</text></g></svg>