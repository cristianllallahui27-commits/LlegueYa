<svg xmlns="http://www.w3.org/2000/svg" width="2080" height="1300" viewBox="0 0 2080 1300" role="img" aria-label="LlegueYa · infraestructura y despliegue propuestos"><defs><marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1,1 L11,6 L1,11 Z" fill="#42566c"/></marker><marker id="realize" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M1,1 L13,7 L1,13 Z" fill="white" stroke="#42566c" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#f8fafc"/><g font-family="Arial, sans-serif" fill="#17243a"><text x="40" y="48" font-size="32" text-anchor="start" font-weight="bold">LlegueYa · infraestructura y despliegue propuestos</text><text x="40" y="88" font-size="21" text-anchor="start">Vista complementaria. No es un nivel adicional C4 ni una infraestructura ya instalada.</text><rect x="520" y="130" width="670" height="290" fill="white" stroke="#61758a" stroke-width="2" stroke-dasharray="10 6"/><text x="538" y="160" font-size="23" text-anchor="start" font-weight="bold">Zona de acceso</text><rect x="520" y="500" width="1480" height="270" fill="white" stroke="#61758a" stroke-width="2" stroke-dasharray="10 6"/><text x="538" y="530" font-size="23" text-anchor="start" font-weight="bold">Red privada de aplicaciones — nodos por definir</text><rect x="520" y="880" width="1480" height="300" fill="white" stroke="#61758a" stroke-width="2" stroke-dasharray="10 6"/><text x="538" y="910" font-size="23" text-anchor="start" font-weight="bold">Zona de datos — acceso restringido</text><path d="M440,237.5 L570,285.0" fill="none" stroke="#42566c" stroke-width="2" marker-end="url(#arrow)"/><path d="M245.0,295 L245,445 L1010,445 L1010.0,350" fill="none" stroke="#42566c" stroke-width="2" marker-end="url(#arrow)"/><path d="M1010.0,350 L1010,470 L1260,470 L1260.0,590" fill="none" stroke="#42566c" stroke-width="2" marker-end="url(#arrow)"/><path d="M1260.0,720 L1260,800 L780,800 L780.0,960" fill="none" stroke="#42566c" stroke-width="2" marker-end="url(#arrow)"/><path d="M1260.0,720 L1260,820 L1235,820 L1235.0,960" fill="none" stroke="#42566c" stroke-width="2" marker-end="url(#arrow)"/><path d="M1260.0,720 L1260,800 L1710,800 L1710.0,960" fill="none" stroke="#42566c" stroke-width="2" marker-end="url(#arrow)"/><path d="M570,655.0 L470,655 L470,800 L245,800 L245.0,650" fill="none" stroke="#42566c" stroke-width="2" marker-end="url(#arrow)"/><path d="M570,655.0 L470,655 L470,870 L245,870 L245.0,960" fill="none" stroke="#42566c" stroke-width="2" marker-end="url(#arrow)"/><rect x="50" y="180" width="390" height="115" fill="#eeeeee" stroke="#666666" stroke-width="2"/><text x="245.0" y="229.5" font-size="21" text-anchor="middle" font-weight="bold">Dispositivo del usuario</text><text x="245.0" y="256.5" font-size="21" text-anchor="middle">Navegador con WEB</text><rect x="570" y="220" width="260" height="130" fill="#dbeafe" stroke="#21609c" stroke-width="2"/><text x="700.0" y="277.0" font-size="21" text-anchor="middle" font-weight="bold">Publicación de WEB</text><text x="700.0" y="304.0" font-size="21" text-anchor="middle">HTML/CSS/JavaScript*</text><rect x="880" y="220" width="260" height="130" fill="#dbeafe" stroke="#21609c" stroke-width="2"/><text x="1010.0" y="251.0" font-size="20" text-anchor="middle" font-weight="bold">GW · Entrada API</text><text x="1010.0" y="277.0" font-size="20" text-anchor="middle">Nginx* / HTTPS</text><text x="1010.0" y="303.0" font-size="20" text-anchor="middle">Enrutamiento y</text><text x="1010.0" y="329.0" font-size="20" text-anchor="middle">límites</text><rect x="570" y="590" width="1380" height="130" fill="#dbeafe" stroke="#21609c" stroke-width="2"/><text x="1260.0" y="633.5" font-size="21" text-anchor="middle" font-weight="bold">I, C, M, E, P, R y A · procesos independientes</text><text x="1260.0" y="660.5" font-size="21" text-anchor="middle">Python/FastAPI* / Docker* opcional</text><text x="1260.0" y="687.5" font-size="21" text-anchor="middle">Tareas persistidas dentro de E y P; réplicas por necesidad</text><path d="M570,978 C570,954 990,954 990,978 L990,1107 C990,1131 570,1131 570,1107 Z" fill="#fff2cc" stroke="#927400" stroke-width="2"/><path d="M570,978 C570,1002 990,1002 990,978" fill="none" stroke="#927400" stroke-width="2"/><text x="780.0" y="1040.0" font-size="21" text-anchor="middle" font-weight="bold">PostgreSQL*</text><text x="780.0" y="1067.0" font-size="21" text-anchor="middle">DI, DC, DM, DE, DP, DR y DA</text><text x="780.0" y="1094.0" font-size="21" text-anchor="middle">Instancias físicas por definir</text><rect x="1060" y="960" width="350" height="150" fill="#dbeafe" stroke="#21609c" stroke-width="2"/><text x="1235.0" y="1013.5" font-size="21" text-anchor="middle" font-weight="bold">BUS · RabbitMQ*</text><text x="1235.0" y="1040.5" font-size="21" text-anchor="middle">Mensajes y reintentos</text><text x="1235.0" y="1067.5" font-size="21" text-anchor="middle">durables</text><path d="M1480,978 C1480,954 1940,954 1940,978 L1940,1107 C1940,1131 1480,1131 1480,1107 Z" fill="#fff2cc" stroke="#927400" stroke-width="2"/><path d="M1480,978 C1480,1002 1940,1002 1940,978" fill="none" stroke="#927400" stroke-width="2"/><text x="1710.0" y="1040.0" font-size="21" text-anchor="middle" font-weight="bold">OBJ · Objetos</text><text x="1710.0" y="1067.0" font-size="21" text-anchor="middle">Fotos, galerías y evidencia</text><text x="1710.0" y="1094.0" font-size="21" text-anchor="middle">Proveedor por definir</text><rect x="50" y="500" width="390" height="150" fill="#eeeeee" stroke="#666666" stroke-width="2"/><text x="245.0" y="553.5" font-size="21" text-anchor="middle" font-weight="bold">Mapas, IA y correo opcional</text><text x="245.0" y="580.5" font-size="21" text-anchor="middle">[Sistemas externos]</text><text x="245.0" y="607.5" font-size="21" text-anchor="middle">Proveedores por definir</text><rect x="50" y="960" width="390" height="180" fill="#eeeeee" stroke="#666666" stroke-width="2"/><text x="245.0" y="1015.0" font-size="21" text-anchor="middle" font-weight="bold">Operación y recuperación</text><text x="245.0" y="1042.0" font-size="21" text-anchor="middle">Logs, métricas y trazas</text><text x="245.0" y="1069.0" font-size="21" text-anchor="middle">Copias y restauración</text><text x="245.0" y="1096.0" font-size="21" text-anchor="middle">Retención y RPO/RTO por definir</text><rect x="442" y="375" width="180.89999999999998" height="60" fill="#f8fafc" opacity="0.97"/><text x="450" y="395" font-size="19" text-anchor="start">Descarga interfaz</text><text x="450" y="420" font-size="19" text-anchor="start">HTTPS</text><rect x="257.0" y="315.0" width="287.59999999999997" height="35" fill="#f8fafc" opacity="0.97"/><text x="265.0" y="335.0" font-size="19" text-anchor="start">Solicita operaciones / HTTPS</text><rect x="1192" y="450" width="316.7" height="35" fill="#f8fafc" opacity="0.97"/><text x="1200" y="470" font-size="19" text-anchor="start">Enruta al servicio / HTTPS JSON</text><rect x="522" y="810" width="307.0" height="60" fill="#f8fafc" opacity="0.97"/><text x="530" y="830" font-size="19" text-anchor="start">Cada servicio usa solo su BD /</text><text x="530" y="855" font-size="19" text-anchor="start">SQL*</text><rect x="1072" y="855" width="258.5" height="35" fill="#f8fafc" opacity="0.97"/><text x="1080" y="875" font-size="19" text-anchor="start">Publica y consume / AMQP*</text><rect x="1492" y="810" width="287.59999999999997" height="35" fill="#f8fafc" opacity="0.97"/><text x="1500" y="830" font-size="19" text-anchor="start">Archivos autorizados / HTTPS</text><rect x="52" y="730" width="268.2" height="60" fill="#f8fafc" opacity="0.97"/><text x="60" y="750" font-size="19" text-anchor="start">Solicita capacidades</text><text x="60" y="775" font-size="19" text-anchor="start">HTTPS / protocolo acordado</text><rect x="52" y="890" width="287.59999999999997" height="60" fill="#f8fafc" opacity="0.97"/><text x="60" y="910" font-size="19" text-anchor="start">Exporta telemetría y realiza</text><text x="60" y="935" font-size="19" text-anchor="start">respaldos</text><text x="40" y="1230" font-size="19" text-anchor="start">Marco: zona de despliegue propuesta. (*) Tecnología candidata, pendiente del SDD. No se fija nube, servidor ni orquestador.</text><text x="40" y="1255" font-size="19" text-anchor="start">Una instancia física compartida debe conservar bases y credenciales aisladas y evaluar su riesgo operativo común.</text></g></svg>