# LlegueYa distribuida en local: nginx (web + gateway) y servicios separados.
#   docker compose up --build        →  http://127.0.0.1:8080
# Para Google en este modo, añade http://127.0.0.1:8080/api/v1/auth/callback en Supabase.
x-servicio: &servicio
  build: .
  read_only: true
  tmpfs: [/tmp]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped

services:
  web:
    image: nginx:1.27-alpine
    ports: ["127.0.0.1:8080:80"]
    volumes:
      - ./infra/nginx/llegueya.conf:/etc/nginx/conf.d/default.conf:ro
      - ./apps/web:/usr/share/nginx/html:ro
    depends_on: [gateway, catalogo, comunidad]
    restart: unless-stopped

  # Identidad + Eventos + Willaq Uma (las sesiones viven en memoria: una sola réplica).
  gateway:
    <<: *servicio
    environment:
      SERVICIO: gateway
      APP_ORIGIN: http://127.0.0.1:8080
      ADMIN_CORREOS: ${ADMIN_CORREOS:-}
      SUPABASE_GOOGLE_ACTIVO: ${SUPABASE_GOOGLE_ACTIVO:-false}
      BORDE_CLAVE: ${BORDE_CLAVE:-}
      SUPABASE_PROJECT_URL: ${SUPABASE_PROJECT_URL:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      DB_CATALOGO_DSN: ${DB_CATALOGO_DSN:-}

  # Sin estado propio: escala horizontalmente detrás de nginx.
  catalogo:
    <<: *servicio
    deploy: { replicas: 2 }
    environment:
      SERVICIO: catalogo
      APP_ORIGIN: http://127.0.0.1:8080
      IDENTIDAD_URL: http://gateway:8000
      DB_CATALOGO_DSN: ${DB_CATALOGO_DSN:-}
      CATALOGO_CACHE_TTL: "60"

  # Con DB_COMUNIDAD_DSN (Supabase) puede tener varias réplicas; sin ella usa memoria (1 réplica).
  comunidad:
    <<: *servicio
    tmpfs: [/tmp, /app/data]
    environment:
      SERVICIO: comunidad
      APP_ORIGIN: http://127.0.0.1:8080
      IDENTIDAD_URL: http://gateway:8000
      DB_COMUNIDAD_DSN: ${DB_COMUNIDAD_DSN:-}
      COMUNIDAD_FOTOS_DIR: /app/data/fotos
